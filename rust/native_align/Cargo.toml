[package]
name = "native_align"
version = "0.1.0"
edition = "2021"
description = "Rust port of the tealeaf.sc.native_align read alignment kernel, exposed through a C ABI"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
